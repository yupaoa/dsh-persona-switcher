name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  npm-publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # `secrets` is not available in a step-level `if:`, so hoist it to a job-level
    # env var and test that instead.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify bundle invariants
        run: npm run verify

      - name: Behaviour simulation
        run: npm test

      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # `prepublishOnly` rebuilds the client bundle and re-runs the invariant
      # check, so the tarball can never contain a stale lib/client.js.
      # Skipped rather than failed while the NPM_TOKEN secret is not configured
      # yet, so pushing a tag is still a useful green signal for a repo that has
      # no npm side set up. It starts publishing as soon as the secret exists.
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
