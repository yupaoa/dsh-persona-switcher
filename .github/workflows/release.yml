name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  npm-publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # `secrets` is not available in a step-level `if:`, so hoist it to a job-level
    # env var and test that instead.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify bundle invariants
        run: npm run verify

      - name: Behaviour simulation
        run: npm test

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # `prepublishOnly` rebuilds the client bundle and re-runs the invariant
      # check, so the tarball can never contain a stale lib/client.js.
      #
      # The emptiness guard lives in the shell on purpose. A step-level `if:`
      # cannot see a job-level `env:` value, so `if: env.NODE_AUTH_TOKEN != ''`
      # silently evaluated as true and published with no token at all, failing
      # the whole v0.1.0 run with an unauthenticated 404 from the registry.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice title=npm publish skipped::NPM_TOKEN is not configured for this repository."
            exit 0
          fi
          npm publish --provenance --access public
