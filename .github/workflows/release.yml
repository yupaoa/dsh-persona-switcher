name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token: npm trusted publishing + provenance attestation

jobs:
  npm-publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `registry-url` is deliberately NOT set: it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # which is exactly the token plumbing this workflow no longer uses.
      # package.json `publishConfig.registry` already pins the registry.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify bundle invariants
        run: npm run verify

      - name: Behaviour simulation
        run: npm test

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # Authentication is OIDC trusted publishing: npm exchanges the GitHub
      # OIDC token for a short-lived publish credential. There is no NPM_TOKEN
      # secret to provision, rotate, leak, or accidentally leave empty.
      #
      # Two earlier revisions tried to skip this step when no token was
      # configured and both failed in production:
      #
      #   1. `if: env.NODE_AUTH_TOKEN != ''` -- a step-level `if:` cannot read a
      #      job-level `env:`, so it always evaluated true and published with no
      #      credential (registry answered 404 on `PUT /dsh-persona-switcher`).
      #   2. A shell-side `[ -z "${NODE_AUTH_TOKEN:-}" ]` guard -- GitHub still
      #      supplied a non-empty NODE_AUTH_TOKEN even though the repository had
      #      no NPM_TOKEN secret at all, so the guard never short-circuited.
      #
      # Hence: no credential-shaped environment variable is involved any more.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
